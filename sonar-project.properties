# SonarQube Cloud project configuration.
# Project: https://sonarcloud.io/project/overview?id=xdubois-57_scoutmagic
#
# sonar.organization is assumed to be "xdubois-57" (SonarQube Cloud's default
# organization key when a project is auto-provisioned from a GitHub account/org
# of the same name, matching the "xdubois-57_scoutmagic" project key prefix).
# Confirm this against Administration > Organization settings in SonarQube
# Cloud and correct it here if the actual key differs.
sonar.projectKey=xdubois-57_scoutmagic
sonar.organization=xdubois-57

sonar.projectName=ScoutMagic
sonar.sourceEncoding=UTF-8

# Application source code analyzed by SonarQube. Excludes tests/ (declared
# separately below via sonar.tests) and anything generated, vendored, or
# storing runtime/user content.
sonar.sources=core,modules,public,bootstrap,scripts
sonar.tests=tests

# Not application source: third-party code, generated artifacts, caches,
# runtime storage (user-uploaded/generated content, encrypted secrets),
# and vendored front-end assets already pinned/audited via
# scripts/release.sh's dependency freshness gate rather than static analysis.
sonar.exclusions=vendor/**,**/vendor/**,node_modules/**,storage/**,public/assets/vendor/**,coverage.xml,coverage-e2e.xml,phpunit-report.xml,.phpunit.result.cache,coverage/**

# tests/js/**/*.test.js (Vitest specs) already live under tests/, so
# sonar.tests=tests above is enough to classify them as test code, not
# production source — same as every PHP test file there, no extra
# property needed.

# The end-to-end harness itself is test infrastructure, not application
# code: scripts/e2e-support.php provisions the throwaway install and merges
# the coverage fragments, and scripts/e2e-coverage-prepend.php is the
# collector that produces them. Nothing can ever cover them — the harness
# runs the suite rather than being run by it, and the collector deliberately
# excludes itself from its own instrumentation. They belong with tests/
# (sonar.tests, already excluded from coverage) and only live under scripts/
# because that is where the `npm run e2e` entry point is. Excluded from
# *coverage* only: both files are still fully analysed for bugs, smells and
# security findings.
sonar.coverage.exclusions=scripts/e2e-support.php,scripts/e2e-coverage-prepend.php

# PHP coverage, merged from two independent reports (SonarQube unions them
# per line, so a line covered by either counts as covered):
#   - coverage.xml       PHPUnit, `vendor/bin/phpunit --coverage-clover`
#   - coverage-e2e.xml   the Playwright end-to-end run, `E2E_COVERAGE=1 npm run e2e`
#                        (pcov inside the `php -S` process — see
#                        scripts/e2e-coverage-prepend.php)
# Both are generated in CI by separate jobs and downloaded here as artifacts
# (see .github/workflows/ci.yml). The end-to-end report is the only coverage
# there is for the composition root: PHPUnit never executes public/index.php,
# which the browser exercises on every single request.
#
# Test execution report is PHPUnit's alone — Playwright reports its results to
# its own HTML report, not to SonarQube.
# Neither file is ever committed — see .gitignore.
sonar.php.coverage.reportPaths=coverage.xml,coverage-e2e.xml
sonar.php.tests.reportPath=phpunit-report.xml

# JavaScript coverage (LCOV), generated in CI by
# `npm run test:coverage` (Vitest + jsdom + @vitest/coverage-v8 — see
# vitest.config.js and package.json). Never committed — see .gitignore.
# Path must match vitest.config.js's coverage.reportsDirectory exactly.
sonar.javascript.lcov.reportPaths=coverage/js/lcov.info

# ── Duplication detection, not enforced on the composition root ────────
#
# public/index.php is a registration list, and a registration list repeats
# by construction: 75 $settingService->register() calls and several hundred
# $router->addRoute() calls, each differing only in its arguments. The
# copy-paste detector reads that as duplicated blocks — 10 of them on main
# BEFORE any of this was touched — and there is no extraction that would
# remove them without turning an explicit, greppable list into a data
# structure plus a loop, which is exactly the trade this file is written
# the other way round to avoid: you can grep for a route or a setting key
# and land on its declaration.
#
# What made this worth declaring rather than living with: the quality gate
# measures duplication in NEW code, so a formatting-only pass over those
# lines (wrapping them under 120 characters for php:S103) re-dated the
# pre-existing duplication as new and failed the gate at 4.4% — while the
# project's overall duplication density went DOWN, 1.0% to 0.9%.
#
# Scoped to this one file, and to duplication ONLY: every rule, bug, smell
# and security finding still applies to public/index.php in full.
sonar.cpd.exclusions=public/index.php

# ── One rule, deliberately not enforced on Twig templates ──────────────
#
# Web:MouseEventWithoutKeyboardEquivalentCheck asks for an `onKeyDown` or
# `onKeyUp` ATTRIBUTE next to every click affordance. That is the one
# remedy this codebase cannot apply: its Content-Security-Policy sets
# `script-src 'self' 'nonce-…'` with no 'unsafe-inline', and a nonce never
# covers an on* attribute (core/Http/Response.php), so an inline handler
# here is dead code that merely looks like a fix. The ban is not a
# convention either — tests/Core/View/UxConventionsTest::
# testNoInlineEventHandlerAttributes() fails the build on one.
#
# Keyboard support is real and lives where it can actually run: a
# delegated `keydown` listener in the extracted script file. The mobile
# movement card the rule flags opens its details modal on Enter and on
# Space, and swallows Space's page scroll — exercised from that very card
# in tests/js/finance-movements.test.js ("opens on Enter and on Space
# from the mobile card"). The analyser cannot see any of that: it reads
# the template, not the script.
#
# Scoped to *.html.twig so the rule keeps its teeth on ordinary HTML.
sonar.issue.ignore.multicriteria=inlineKeyboardHandler,ddlEnumLiteral
sonar.issue.ignore.multicriteria.inlineKeyboardHandler.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.inlineKeyboardHandler.resourceKey=**/*.html.twig

# S1192 ("define a constant instead of duplicating this literal") in a
# schema.sql, where the remedy it names does not exist.
#
# A role value is written three times in modules/calendar/schema.sql and
# cannot be written fewer: once in `visibility ENUM('public','chief',
# 'admin')`, once in `edit_role_min ENUM('chief','admin')`, and once as
# that column's `DEFAULT 'chief'` — the default being what reproduces each
# existing calendar's behaviour exactly, so it cannot be dropped. MySQL has
# no CREATE TYPE, no domain and no constant an ENUM member or a DEFAULT
# could refer to, so the third occurrence is not a duplication anyone can
# remove; it is how the column is declared. The rule is written for PL/SQL
# procedural code, where a constant is available.
#
# Scoped to schema.sql so the rule keeps its teeth on every other file,
# PHP included.
sonar.issue.ignore.multicriteria.ddlEnumLiteral.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.ddlEnumLiteral.resourceKey=**/schema.sql
