<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Locations #927</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: ScoutMagic Bootstrap-like look, hand-rolled; mockup control bar on top, then the booking pages at desktop or phone width. */
:root{
  --bg:#f3f4f7; --surface:#fff; --surface-2:#f8f9fb; --fg:#1f2430; --muted:#5f6675; --line:#dfe2e8;
  --primary:#2f5bd3; --primary-fg:#fff; --ok:#1e7a46; --ok-bg:#e3f4ea; --warn:#8a5a00; --warn-bg:#fff3d6;
  --danger:#b4232c; --danger-bg:#fde7e8; --info-bg:#e8eefc; --new:#7a2fd3; --mod:#c46200; --same:#7b8190;
  --font:"Source Sans 3","Segoe UI",system-ui,sans-serif; --mono:ui-monospace,"JetBrains Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161b; --surface:#1d2027; --surface-2:#23262e; --fg:#e7e9ee; --muted:#a2a8b5; --line:#343844;
  --primary:#6f93f2; --primary-fg:#0e1220; --ok:#6fd39b; --ok-bg:#183326; --warn:#f2c35e; --warn-bg:#3a2f12;
  --danger:#ff8a90; --danger-bg:#3d1c20; --info-bg:#1f2a45; --new:#b892f5; --mod:#f2a25e; --same:#8b91a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161b; --surface:#1d2027; --surface-2:#23262e; --fg:#e7e9ee; --muted:#a2a8b5; --line:#343844;
  --primary:#6f93f2; --primary-fg:#0e1220; --ok:#6fd39b; --ok-bg:#183326; --warn:#f2c35e; --warn-bg:#3a2f12;
  --danger:#ff8a90; --danger-bg:#3d1c20; --info-bg:#1f2a45; --new:#b892f5; --mod:#f2a25e; --same:#8b91a0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
a{color:var(--primary)}
.mock-bar{max-width:1100px;margin:0 auto 14px;background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.mock-bar b{font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.mock-bar label{display:inline-flex;gap:6px;align-items:center}
.mock-bar select{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);color:var(--fg);padding:5px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg)}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid currentColor;vertical-align:middle;background:var(--surface)}
.tag.new{color:var(--new)}.tag.mod{color:var(--mod)}.tag.same{color:var(--same)}.tag.gone{color:var(--danger)}
.frame{max-width:1100px;margin:0 auto}
.frame.phone{max-width:400px}
.site{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.crumbs{font-size:13px;color:var(--muted);padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.page{padding:18px;display:flex;flex-direction:column;gap:14px}
.ph{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph h1{font-size:24px}
.sub{font-size:14px;color:var(--muted)}
.rail{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.rail a{padding:8px 10px;text-decoration:none;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;font-size:14px}
.rail a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--primary);font-weight:600}
.zone{position:relative;border:1px dashed transparent;border-radius:9px}
.zone>.tag{position:absolute;top:-9px;right:10px;z-index:1}
.zone.new{border-color:color-mix(in srgb,var(--new) 45%,transparent)}
.zone.mod{border-color:color-mix(in srgb,var(--mod) 45%,transparent)}
.zone.same{border-color:color-mix(in srgb,var(--same) 35%,transparent)}
.zone.gone{border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.card{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.card>header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.card>header h2{font-size:16px}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.todo{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.info{background:var(--info-bg);color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:6px;font-size:14px;text-decoration:none;display:inline-block}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.outline{border-color:var(--muted)}
.btn.danger-o{border-color:var(--danger);color:var(--danger)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.alert{border-radius:7px;padding:9px 12px;font-size:14px}
.alert.warn{background:var(--warn-bg);border-left:4px solid var(--warn)}
.alert.danger{background:var(--danger-bg);border-left:4px solid var(--danger)}
.alert.info{background:var(--info-bg);border-left:4px solid var(--primary)}
.alert.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:7px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 9px;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;background:var(--surface-2);font-weight:600}
td.r,th.r{text-align:right}
.old{color:var(--muted);text-decoration:line-through}
.newv{font-weight:700}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cmp>div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.cmp>div.now{background:var(--surface-2)}
.cmp>div.next{border-color:var(--primary)}
.k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-variant-numeric:tabular-nums}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:8px;align-items:center;font-size:14px}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--line);color:var(--muted);flex:none}
.dot.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.dot.cur{border-color:var(--primary);color:var(--primary)}
.form{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.field label{display:block;font-weight:600;margin-bottom:4px;font-size:14px}
.field input,.field select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);font:inherit}
.field input:disabled{background:var(--surface-2);color:var(--muted)}
.help{font-size:12.5px;color:var(--muted);margin-top:3px}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.qrwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.qr{width:150px;height:150px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:8px;cursor:zoom-in;flex:none}
.qr canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.comm{font-family:var(--mono);font-size:15px;letter-spacing:.02em;font-weight:600}
details.fold>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"▾";color:var(--muted)}
details.fold[open]>summary::after{content:"▴"}
details.fold>summary h2{font-size:16px}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);color:var(--fg);border-radius:10px;max-width:560px;width:100%;max-height:88vh;overflow:auto;border:1px solid var(--line)}
.modal header,.modal footer{padding:12px 16px}
.modal header{border-bottom:1px solid var(--line)}
.modal footer{border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal .mb{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.qrbig{width:min(320px,80vw);height:min(320px,80vw);background:#fff;padding:12px;border-radius:8px;margin:0 auto}
.qrbig canvas{width:100%;height:100%;image-rendering:pixelated}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:30}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:7px;padding:9px 12px;box-shadow:0 4px 14px rgba(0,0,0,.15);max-width:320px;font-size:14px}
.screen[hidden],.pill[hidden]{display:none}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
</style>
</head>
<body>

<div class="mock-bar" role="region" aria-label="Commandes de la maquette">
  <b>Maquette #927</b>
  <div class="seg" id="screenSeg">
    <button type="button" data-s="dash" aria-pressed="true">Tableau de bord</button>
    <button type="button" data-s="mods" aria-pressed="false">Modifications</button>
    <button type="button" data-s="proj" aria-pressed="false">Page d'une modification</button>
    <button type="button" data-s="fin" aria-pressed="false">Finances</button>
    <button type="button" data-s="docs" aria-pressed="false">Documents</button>
    <button type="button" data-s="inv" aria-pressed="false">Facture</button>
    <button type="button" data-s="mail" aria-pressed="false">Courrier</button>
    <button type="button" data-s="track" aria-pressed="false">Suivi locataire</button>
  </div>
  <div class="seg" id="widthSeg">
    <button type="button" data-w="desk" aria-pressed="true">Ordinateur</button>
    <button type="button" data-w="phone" aria-pressed="false">Téléphone</button>
  </div>
  <label><input type="checkbox" id="simSent" checked> Premier contrat envoyé</label>
  <label>Modification <select id="simProj">
    <option value="none">aucune</option>
    <option value="draft" selected>en préparation</option>
    <option value="sent">contrat envoyé — copie attendue</option>
    <option value="received">copie reçue à vérifier</option>
    <option value="refused">copie refusée</option>
  </select></label>
  <label><input type="checkbox" id="simFin" checked> Finances actif</label>
  <label><input type="checkbox" id="simSettle"> Décompte validé</label>
  <div class="legend"><span class="tag new">nouveau</span><span class="tag mod">modifié</span><span class="tag same">inchangé</span><span class="tag gone">retiré</span></div>
</div>

<div class="frame" id="frame">
  <section class="site" aria-label="Pages de la réservation">
    <div class="crumbs" id="crumbs"></div>
    <div class="page" id="page"></div>
  </section>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalHost"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COMM='+++270/3140/51697+++';
const st={screen:'dash',sent:true,proj:'draft',fin:true,settle:false,history:[
  {d:'02/02/2027',what:'Dates 12 → 14 mars, 25 pers.',status:'Appliquée directement',by:'Xavier Dubois',note:'avant le premier envoi'},
  {d:'21/02/2027',what:'Ajout ligne « Nettoyage » 80,00 €',status:'Annulée',by:'Claire Martin',note:'contrat de remplacement non envoyé'}
]};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3000)}
function modal(h){$('#modalHost').innerHTML=`<div class="overlay" role="dialog" aria-modal="true">${h}</div>`;const c=$('#modalHost [data-cancel]');if(c)c.focus()}
function closeModal(){$('#modalHost').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function ask(title,msg,label,fn,danger){
  modal(`<div class="modal"><header><h3>${esc(title)}</h3></header><div class="mb"><p style="margin:0">${msg}</p></div><footer><button class="btn outline" type="button" data-cancel>Annuler</button><button class="btn ${danger?'danger':'primary'}" type="button" id="okBtn">${esc(label)}</button></footer></div>`);
  $('#okBtn').addEventListener('click',()=>{closeModal();fn()});
}
document.addEventListener('click',e=>{if(e.target.closest('[data-cancel]'))closeModal()});

/* ---------- tiny QR-like pattern (illustrative, not scannable) ---------- */
function drawQr(canvas,seed){const n=29,ctx=canvas.getContext('2d');canvas.width=n;canvas.height=n;ctx.fillStyle='#fff';ctx.fillRect(0,0,n,n);ctx.fillStyle='#000';let x=seed;for(let i=0;i<n;i++)for(let j=0;j<n;j++){x=(x*1103515245+12345)&0x7fffffff;if(x%3===0)ctx.fillRect(i,j,1,1)}
  [[0,0],[n-7,0],[0,n-7]].forEach(([a,b])=>{ctx.fillStyle='#000';ctx.fillRect(a,b,7,7);ctx.fillStyle='#fff';ctx.fillRect(a+1,b+1,5,5);ctx.fillStyle='#000';ctx.fillRect(a+2,b+2,3,3)})}

/* ---------- shared pieces ---------- */
const header=()=>`<div class="ph"><h1>LOC-2027-014</h1><span class="pill info">Contrat envoyé</span></div>
  <div class="sub">Local Saint-Georges · Patro Sainte-Anne (Julie Lambert) · 12 → 14 mars 2027 · 25 personnes</div>`;
const RAIL=[['dash','Tableau de bord'],['mods','Modifications'],['fin','Finances'],['docs','Documents'],['inv','Facture'],['mail','Courrier']];
function rail(cur){return `<nav class="rail" aria-label="Pages de la réservation">${RAIL.map(([k,l])=>`<a href="#" data-go="${k}" ${k===cur?'aria-current="page"':''}>${l}${k==='mods'&&st.proj!=='none'?' (1)':''}</a>`).join('')}</nav>`}
function zone(kind,label,inner){return `<div class="zone ${kind}"><span class="tag ${kind}">${label}</span>${inner}</div>`}
const projActive=()=>st.proj!=='none';
const PROJ_STATUS={draft:['En préparation','info'],sent:['Copie signée attendue','warn'],received:['Copie reçue à vérifier','warn'],refused:['Copie refusée — nouvelle copie attendue','danger']};
function nextStep(){return {draft:'Générer puis envoyer le contrat de remplacement',sent:'Attendre la copie signée du locataire',received:'Vérifier la copie, puis contresigner',refused:'Attendre une nouvelle copie du même contrat'}[st.proj]}

function bannerHtml(){
  if(!projActive()) return '';
  const [s,c]=PROJ_STATUS[st.proj];
  return zone('new','nouveau',`<div class="alert info banner"><div><b>Une modification est en cours</b> <span class="pill ${c}">${s}</span><div class="small">Les dates, le nombre de participants, le prix et le contrat affichés ci-dessous restent ceux qui s'appliquent tant que la modification n'est pas contresignée.</div></div><a href="#" class="btn" data-go="proj">Voir la modification</a></div>`);
}

/* ---------- screens ---------- */
function nextAction(){
  let head,lines=[],primary='';
  const hold=st.proj==='received'?'Dates bloquées fermement : copie signée reçue le 03/03/2027.':'Dates bloquées jusqu\'au 18/03/2027 ; sans copie signée, elles se libèrent à cette date.';
  if(projActive()){
    head={draft:'Modification en cours : envoyer le contrat de remplacement',sent:'Modification en cours : copie signée du nouveau contrat attendue',received:'Modification en cours : vérifier la copie signée et contresigner',refused:'Modification en cours : nouvelle copie attendue (la précédente a été refusée)'}[st.proj];
    lines.push('Les dates, les participants, le prix et le contrat de cette page restent ceux qui s\'appliquent jusqu\'à la contresignature.');
    primary={draft:'<a href="#" class="btn primary" data-go="proj">Ouvrir la modification</a>',sent:'<a href="#" class="btn primary" data-go="proj">Ouvrir la modification</a>',received:'<a href="#" class="btn primary" data-go="docs">Vérifier et contresigner</a>',refused:'<a href="#" class="btn primary" data-go="proj">Ouvrir la modification</a>'}[st.proj];
  } else {
    head='Attendre la copie signée du contrat';
    primary='<a href="#" class="btn" data-go="docs">Voir le contrat</a>';
  }
  return `<div class="card"><header><h2>Prochaine action</h2></header><div class="body">
    <div style="font-weight:600">${head}</div>
    ${lines.map(l=>`<div class="small muted">${l}</div>`).join('')}
    <div class="small" style="color:var(--warn)">${hold}</div>
    <div class="actions">${primary}<button class="btn outline" type="button" data-act="noop">Autres décisions</button></div></div></div>`;
}
function dash(){
  return `${header()}${rail('dash')}
  ${zone('mod','modifié — même boîte, nouveaux cas',nextAction())}
  ${zone('same','inchangé',`<div class="card"><header><h2>Cycle de vie</h2></header><div class="body small muted">Phases et étapes inchangées (page #462). L'étape « Dates bloquées » dit désormais « bloquées fermement » dès qu'une copie signée non refusée est reçue.</div></div>`)}`;
}

function mods(){
  let top;
  if(!st.sent){
    top=zone('new','nouveau — avant le premier envoi',`<div class="card"><header><h2>Modifier la réservation</h2><span class="pill todo">Aucun contrat envoyé</span></header><div class="body">
      <div class="small">Tant qu'aucun contrat n'a été envoyé, vos changements s'appliquent directement à la réservation. Ils restent dans l'historique ; le locataire n'est pas prévenu. Un contrat déjà généré mais pas envoyé est marqué « à régénérer ».</div>
      <div class="actions"><a href="#" class="btn primary" data-go="proj">Modifier les dates, les participants ou le prix</a></div></div></div>`);
  } else if(!projActive()){
    top=zone('new','nouveau',`<div class="card"><header><h2>Modification en cours</h2><span class="pill todo">Aucune</span></header><div class="body">
      <div class="small">Un contrat a déjà été envoyé : toute modification passe par un contrat de remplacement, que le locataire signe. La réservation actuelle ne change pas avant votre contresignature.</div>
      <div class="actions"><a href="#" class="btn primary" data-go="proj">Créer une modification</a></div></div></div>`);
  } else {
    const [s,c]=PROJ_STATUS[st.proj];
    top=zone('new','nouveau',`<div class="card"><header><h2>Modification en cours</h2><span class="pill ${c}">${s}</span></header><div class="body">
      <div class="cmp"><div class="now"><div class="k">Aujourd'hui</div><dl class="kv"><dt>Dates</dt><dd>12 → 14 mars</dd><dt>Participants</dt><dd>25</dd><dt>Prix</dt><dd>540,00 €</dd></dl></div>
      <div class="next"><div class="k">Après contresignature</div><dl class="kv"><dt>Dates</dt><dd class="newv">12 → 15 mars</dd><dt>Participants</dt><dd class="newv">32</dd><dt>Prix</dt><dd class="newv">748,00 €</dd></dl></div></div>
      <div class="small"><b>Prochaine étape :</b> ${nextStep()}</div>
      <div class="actions"><a href="#" class="btn primary" data-go="proj">Ouvrir la modification</a></div></div></div>`);
  }
  const hist=`<div class="card"><header><h2>Historique des modifications</h2></header><div class="body"><div class="tw"><table><thead><tr><th>Date</th><th>Changement</th><th>Statut</th><th>Par</th><th></th></tr></thead><tbody>
    ${st.history.map(h=>`<tr><td>${h.d}</td><td>${esc(h.what)}</td><td><span class="pill ${h.status==='Annulée'?'danger':'ok'}">${esc(h.status)}</span><div class="small muted">${esc(h.note)}</div></td><td>${esc(h.by)}</td><td><a href="#" data-go="proj">Consulter</a></td></tr>`).join('')}
    </tbody></table></div></div></div>`;
  return `${header()}${rail('mods')}${top}${zone('new','nouveau',hist)}
  ${zone('gone','retiré',`<div class="card"><div class="body small muted">Demandes et propositions de modification (accepter / refuser) : supprimées des deux côtés.</div></div>`)}`;
}

function priceTable(editable){
  const rows=[['Location du local — nuit','3 nuits','180,00','540,00'],['Supplément par personne au-delà de 25','7 pers.','8,00','56,00'],['Nettoyage final (tarif du bien)','1','120,00','120,00']];
  return `<div class="tw"><table><thead><tr><th>Ligne</th><th class="r">Qté</th><th class="r">Prix unitaire</th><th class="r">Montant</th></tr></thead><tbody>

function proj(){

  const steps=direct?'':`<ol class="steps">
    ${[['Préparer les nouvelles conditions','draft'],['Envoyer le contrat de remplacement','sent'],['Recevoir la copie signée','received'],['Contresigner : la modification s\'applique','done']].map(([l,k],i)=>{
      const order=['none','draft','sent','received','done']; const cur=st.proj==='refused'?'sent':st.proj; const ci=order.indexOf(cur); const ki=order.indexOf(k);
      const cls=ki<ci?'done':(ki===ci?'cur':''); return `<li><span class="dot ${cls}">${ki<ci?'✓':i+1}</span>${l}</li>`}).join('')}</ol>`;
  const dis=locked?'disabled':'';

    <div><h3 style="font-size:15px;margin-bottom:6px">Prix <span class="tag mod">déplacé depuis Finances</span></h3>${priceTable(!locked)}</div>
    ${locked?'<div class="alert info small">Le contrat de remplacement est parti : ces conditions ne se modifient plus. Pour corriger, annulez cette modification et créez-en une nouvelle.</div>':''}

  else if(st.proj==='received') actions=`<a href="#" class="btn primary" data-go="docs">Vérifier et contresigner</a><button class="btn danger-o" type="button" data-act="cancelProj">Annuler la modification</button>`;
  const docs=direct||st.proj==='none'||st.proj==='draft'?'':`<div class="alert info small">Le contrat de remplacement, la copie signée du locataire, sa vérification et la contresignature se gèrent sur la page <a href="#" data-go="docs">Documents</a>, à côté du contrat en vigueur.</div>`;
  return `<div class="ph"><h1>${title}</h1><span class="pill ${c}">${s}</span></div><div class="sub">LOC-2027-014 · Local Saint-Georges</div>
