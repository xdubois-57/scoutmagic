# Removes hidden content from issues and comments before an agent reads them
# (issue #1117, audit SEC-020).
#
# WHY. Anybody with a GitHub account can open an issue here or comment on
# one, and agents then read the RAW text: the triage, and the « fixe le
# backlog » agent, which implements an issue once the maintainer moved it to
# Ready. The maintainer reads the RENDERED view. An HTML comment, or an
# instruction spelled in invisible Unicode, is in the first and not in the
# second: an instruction nobody approved, read by an agent that writes code.
#
# WHAT. Each new or edited issue body and comment goes through
# scripts/strip-hidden-issue-content.sh — every `<!-- … -->` (an unclosed one
# to the end of the text), Unicode tag characters, zero-width characters and
# bidirectional controls — and every hidden run is replaced with a VISIBLE
# « ⚠️ [contenu caché retiré automatiquement] », so the removal is seen.
#
# WHAT IT NEVER TOUCHES: a text written by a bot. This repository's own
# workflows write HTML comments on purpose and search for them later
# (external-source markers, the « fixed » notice, the review status). A
# human has no reason to write one, so a human text loses them all,
# imitated markers included.
#
# NO LOOP. The rewrite triggers `edited`, and that run finds nothing left to
# remove, so it writes nothing: the filter is idempotent, and
# scripts/sanitize-issue-thread.sh only PATCHes a text that changed.
#
# THE RACE WITH THE TRIAGE: both start on `opened`. The triage job does not
# wait for this one — it runs the same script on the whole thread itself,
# before its agent reads anything (issue-triage.yml). This workflow covers
# what the triage never sees: edits, later comments, and the issues the
# backlog agent will read once they are Ready.
#
# SAFETY. Deny-by-default, `issues: write` for the one job, nothing else.
# No checkout: the scripts are read from `main` through the API, the reviewed
# copy, never one an issue could point at. The text is read from the API by
# the script and piped; nothing from the event payload is interpolated into
# `run:`, only the numeric ids, through `env:`.
# Audited by tests/Security/IssueTriageWorkflowPermissionsTest.php.
name: Issue sanitize

permissions: {}

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  # Once, by hand, after this workflow first lands: every OPEN issue's
  # thread, since what was written before it existed was never filtered —
  # the Ready queue included, and the open issues the external-sources
  # agent lists. Idempotent, so a second run writes nothing.
  workflow_dispatch:

concurrency:
  # One run at a time per text: an edit landing while the previous rewrite
  # is in flight waits for it rather than racing it.
  group: issue-sanitize-${{ github.event.comment.id || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sanitize:
    # A bot's own writes — this workflow's rewrite included — are never
    # touched, and skipping them here saves a runner. The script checks the
    # stored text's author again, which is what actually decides.
    # Not a pull request either: `issue_comment` fires on both, a review
    # conversation is not what the agents read, and `issues: write` cannot
    # read a PR comment — every human PR comment would be a red run.
    if: github.event.sender.type != 'Bot' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Fetch the sanitizing scripts from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sanitize"
          for script in strip-hidden-issue-content.sh sanitize-issue-thread.sh; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/scripts/${script}?ref=main" \
              > "${RUNNER_TEMP}/sanitize/${script}"
            [ -s "${RUNNER_TEMP}/sanitize/${script}" ] || {
              echo "::error title=Sanitize script missing::scripts/${script} could not be read from main."
              exit 1
            }
          done

      - name: Remove hidden content
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            bash "${RUNNER_TEMP}/sanitize/sanitize-issue-thread.sh" open 0
          elif [ "${EVENT_NAME}" = "issue_comment" ]; then
            bash "${RUNNER_TEMP}/sanitize/sanitize-issue-thread.sh" comment "${COMMENT_ID}"
          else
            bash "${RUNNER_TEMP}/sanitize/sanitize-issue-thread.sh" issue "${ISSUE_NUMBER}"
          fi
