# The path from an agent session WITHOUT `gh` to ScoutMagic Project #1
# (issue #923 § 3 and § 10): « fix the backlog » runs in sessions that have
# the GitHub MCP tools and nothing else, and the user-owned Project is
# reachable only with the PROJECTS_TOKEN secret, which must never be copied
# to an agent. So the agent DISPATCHES this workflow — with
# `actions_run_trigger`, or `gh workflow run backlog-project.yml` where gh
# exists — and reads the answer from the run's log (`actions_get`,
# `get_job_logs`). The credential stays in this one step.
#
#   queue    prints the Ready queue as JSON between QUEUE-JSON-BEGIN/END
#            (scripts/backlog-ready-queue.sh: read-only, Priority and the
#            native `blocked by` links applied, an unreadable Project is an
#            error and never an empty queue);
#   status   prints the Project's view of one issue — the way to see that it
#            was Canceled before arming an auto-merge;
#   claim | done | release   move Status and the Agent field of ONE issue
#            (scripts/project-agent.sh). None of these is the lock — the
#            lock is the branch `claude/issue-<n>` created through the API —
#            and the script refuses to contradict it: no claim without the
#            branch, no takeover of another agent's reservation, no Done
#            before the issue closed as completed, no moving a Canceled issue.
#
# Inputs are data: they reach the shell through `env`, never through `${{ }}`
# inside `run:`, and the scripts validate them again (an agent is a label such
# as « Claude A1 », not free text). The job refuses any ref but `main`, and
# fetches the scripts from `main` through the API, so a dispatch against a
# branch cannot run edited code with the PAT. Dispatching needs write access to
# the repository, which is what an agent session already has; the token can
# only do what these scripts do.
name: Backlog project

run-name: Backlog project — ${{ inputs.action }} ${{ inputs.issue }} ${{ inputs.agent }}

permissions: {}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Operation
        required: true
        type: choice
        options: [queue, status, claim, done, release]
      issue:
        description: Issue number (not for queue)
        required: false
        default: ''
        type: string
      agent:
        description: Agent identity, e.g. "Claude A1" (claim, done, release)
        required: false
        default: ''
        type: string

concurrency:
  # One operation per issue at a time; reads do not queue behind writes.
  group: backlog-project-${{ inputs.action == 'queue' && 'queue' || inputs.issue }}
  cancel-in-progress: false

jobs:
  project:
    name: Project operation
    if: github.repository == 'xdubois-57/scoutmagic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fetch the scripts from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/scripts"
          for script in project-lib.sh backlog-ready-queue.sh project-agent.sh; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/scripts/${script}?ref=main" \
              > "${RUNNER_TEMP}/scripts/${script}"
            [ -s "${RUNNER_TEMP}/scripts/${script}" ] || {
              echo "::error title=Script missing::scripts/${script} could not be read from main."
              exit 1
            }
          done

      # THE ONLY STEP THAT HOLDS THE PROJECTS TOKEN.
      - name: Run the operation
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          OPERATION: ${{ inputs.action }}
          ISSUE: ${{ inputs.issue }}
          AGENT: ${{ inputs.agent }}
        run: |
          set -euo pipefail
          scripts="${RUNNER_TEMP}/scripts"

          # Every answer is ALSO written as a `::notice` annotation, the one
          # output of a run the GitHub API returns inline
          # (GET /check-runs/{id}/annotations). The log and the step summary
          # live on a storage host an agent session without `gh` cannot
          # reach, so before this the queue it dispatched was unreadable to
          # it (issue #912). Workflow-command escaping: %, CR, LF.
          annotate() {
            local title="$1" body
            body="$(cat)"
            body="${body//'%'/'%25'}"
            body="${body//$'\r'/'%0D'}"
            body="${body//$'\n'/'%0A'}"
            echo "::notice title=${title}::${body}"
          }

          case "${OPERATION}" in
            queue)
              out="$(mktemp)"
              bash "${scripts}/backlog-ready-queue.sh" > "${out}"
              echo 'QUEUE-JSON-BEGIN'
              cat "${out}"
              echo 'QUEUE-JSON-END'
              {
                echo '### Ready queue'
                echo '```json'
                cat "${out}"
                echo '```'
              } >> "${GITHUB_STEP_SUMMARY}"
              jq -c . "${out}" 2>/dev/null | annotate 'Ready queue' || annotate 'Ready queue' < "${out}"
              ;;
            status|claim|done|release)
              out="$(mktemp)"
              status=0
              if [ "${OPERATION}" = status ]; then
                bash "${scripts}/project-agent.sh" status "${ISSUE}" > "${out}" 2>&1 || status=$?
              else
                bash "${scripts}/project-agent.sh" "${OPERATION}" "${ISSUE}" "${AGENT}" > "${out}" 2>&1 || status=$?
              fi
              cat "${out}"
              annotate "Project ${OPERATION} #${ISSUE//[^0-9]/} (exit ${status})" < "${out}"
              exit "${status}"
              ;;
            *)
              echo "::error title=Unknown operation::'${OPERATION}' is not one of queue, status, claim, done, release."
              exit 2
              ;;
          esac
