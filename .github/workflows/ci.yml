# The fast feedback loop: every gate, on every push to main and every pull
# request against it.
#
# The gates themselves live in checks.yml, which this workflow and
# release.yml both call — so a CI run and a release run can never disagree
# about what "green" means. Read that file for what each job does; this one
# only decides WHEN they run and adds the one job that turns eight verdicts
# into one.
#
# THE ONE VERDICT (`All checks`)
# ---------------------------------------------------------------------------
# GitHub's branch ruleset blocks a merge on the status checks it is told to
# require, by name — and a check that is not on that list blocks nothing,
# red or still running (issue #170 records `database-mariadb`, `Authorization
# matrix` and `Dynamic scan (passive)` doing exactly that, and #168 merging
# with a scan still in flight). Listing every job there is the obvious fix
# and the fragile one: each required name is a merge that stalls forever the
# day that job is renamed or removed, because the ruleset keeps waiting for
# a check that will never report again.
#
# So there is one job to require instead. `All checks` needs every other
# job, runs whatever they concluded (`if: always()`), and goes red unless
# each of them succeeded. Its name never changes when a gate is added,
# renamed or split; the list of what it waits for is in this file, reviewed
# like any other change. It has been a required context on `main` since
# 2026-09-06 — Settings → Rules → Rulesets → Main → Require status checks
# to pass, alongside `Claude review` — which is what closed #170. That is a
# repository setting no diff here can show, so renaming this job silently
# stops gating anything: docs/quality-pipeline.md § Branch ruleset on `main`
# is where its current state is recorded.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    # evidence is left at its default (false): a CI run produces a verdict,
    # not an evidence pack. SONAR_TOKEN reaches the sonarqube job this way.
    secrets: inherit

  all-checks:
    name: All checks
    runs-on: ubuntu-latest
    needs: [checks]
    # Runs even when a needed job failed or was cancelled — that is the
    # whole point: without it a failure upstream would leave this job
    # *skipped*, and a skipped required check is one GitHub treats as
    # "expected", which reads on the pull request exactly like a check that
    # never ran (the same misreading #152 cost an hour to).
    if: always()
    steps:
      - name: Every gate must have succeeded
        env:
          # The reusable workflow's result is the roll-up of every job in it:
          # failure if any failed, cancelled if any was cancelled. A job
          # skipped by its own `if:` (SonarQube Cloud on a pull request from
          # a fork) does not turn it red — that pull request cannot merge
          # anyway, since `Claude review` cannot run without the secret
          # either (docs/quality-pipeline.md § What forks cannot have).
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          echo "Checks: ${CHECKS_RESULT}"
          if [ "${CHECKS_RESULT}" != "success" ]; then
            echo "::error::at least one gate did not succeed (${CHECKS_RESULT}) — see the Checks jobs above."
            exit 1
          fi
