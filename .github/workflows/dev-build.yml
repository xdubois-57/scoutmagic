# Development-channel build.
#
# Every push to main produces the SAME kind of installable artifact
# scripts/release.sh publishes for the stable channel — repository tree
# plus a production vendor/, minus tests/, .github/, bootstrap/, storage/
# and the rest — and attaches it to a single rolling PRERELEASE tagged
# `dev-build`.
#
# Why this exists: a site on `auto_update_level = dev` used to install
# https://api.github.com/repos/{repo}/zipball/{sha} on every push. That is
# the git tree, so it carries no vendor/ (gitignored) while it does carry
# tests/, .github/, bootstrap/ and scripts/ straight onto a production
# webroot — and because InstallUpdateHandler::installFiles() copies
# additively, the live vendor/ was never replaced even as composer.lock on
# disk was. Measured on scoutmagic.be: vendor/'s mtime stayed at the
# original install date across roughly 40 dev updates while composer.lock
# advanced. Silent drift, with no symptom until a new dependency is
# actually called.
#
# THE PRERELEASE FLAG IS AN INVARIANT, not a preference. The stable
# channel reads GET /repos/{owner}/{repo}/releases/latest
# (Core\Maintenance\GitHubReleaseClient), which GitHub defines as
# excluding drafts and prereleases. That single fact is what keeps the two
# channels apart: a `dev-build` release that ever became "latest" would be
# offered to, and auto-installed by, every site on patch/minor/major.
#
# THE TAG IS `dev-latest`, AND THE ORIGINAL `dev-build` IS UNUSABLE
# FOREVER: a tag name once used by an immutable release stays reserved by
# GitHub's rulesets even after that release is deleted AND the repository
# setting is disabled ("tag_name was used by an immutable release" —
# measured over three attempts). If this tag ever has to change again,
# every installed site still runs code pointing at the previous name
# (GitHubWebhookService::DEV_BUILD_TAG): plan the bridge before renaming.
#
# THIS REPOSITORY HAD RELEASE IMMUTABILITY ENABLED, and that shaped the
# whole publish step. A published release's assets and tag are frozen —
# the first version of this workflow created the release and then tried
# `gh release upload`, and GitHub answered
# "HTTP 422: Cannot upload assets to an immutable release" (run #1).
# The only supported way to change what `dev-build` serves is therefore
# to DELETE the previous release outright and create a new one whose
# asset is already attached when it is published: create as a DRAFT with
# the file, then flip the draft bit. The flow is kept even now that the
# setting is off — it works in both worlds, where upload-after-publish
# only works in one.

name: Dev build

on:
  push:
    branches: [main]

# Publishing the rolling prerelease needs to write the tag ref, the
# release and its assets — and nothing else. No packages, no id-token, no
# pull-requests.
permissions:
  contents: write

# Two pushes seconds apart would otherwise race on the same tag, the same
# release and the same asset list. Queued rather than cancelled: an
# in-flight run's artifact may already be what a site is downloading, and
# the retention prune below is only correct when runs are serialized.
concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Same action, pin and PHP version as the CI workflow's jobs
      # (composer.json requires "php": "^8.4"). No coverage driver: this
      # job runs no tests, it only resolves dependencies and zips a tree.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, openssl, imagick
          coverage: none

      # The one implementation of "what an installable artifact is",
      # shared with scripts/release.sh so the two channels cannot drift.
      # It runs composer install --no-dev --optimize-autoloader itself and
      # asserts vendor/autoload.php is in the zip and no root .htaccess is.
      - name: Build the artifact
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ASSET="scoutmagic-dev-${SHORT_SHA}.zip"
          echo "ASSET=${ASSET}" >> "${GITHUB_ENV}"
          ./scripts/build-artifact.sh "${GITHUB_WORKSPACE}/${ASSET}"

      # See the header: release immutability means the previous release is
      # deleted and a fresh one is created with its asset already attached
      # at publish time. During the delete→publish window (about a second,
      # plus this job's ~1 min build) the download URL answers 404 — which
      # is exactly the case Task\InstallUpdateHandler's wait-for-artifact
      # loop exists for, so an in-flight install retries rather than fails.
      #
      # Every deletion is tolerated failing (`|| true`) EXCEPT the final
      # publish: a leftover release or tag degrades to a stale-but-working
      # asset and a loud log line, while a hard stop here would leave the
      # dev channel with no artifact at all for this commit.
      - name: Publish the dev-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: dev-latest
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --yes \
              || echo "WARNING: could not delete the previous ${RELEASE_TAG} release; publish below may fail"
          fi
          # The tag is frozen alongside an immutable release and freed by
          # its deletion; remove it so the draft below re-creates it at
          # THIS commit rather than reusing wherever it pointed before.
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" >/dev/null 2>&1 \
            || echo "NOTE: no previous ${RELEASE_TAG} tag to delete (or deletion refused; the release will reuse it)"

          gh release create "${RELEASE_TAG}" "${GITHUB_WORKSPACE}/${ASSET}" \
            --draft --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Development build" \
            --notes "Rolling build of the \`main\` branch (\`${GITHUB_SHA}\`), published for installations tracking the development channel (\`auto_update_level = dev\`). Never a stable release: this is a prerelease on purpose, so \`/releases/latest\` — the stable channel's only source — never sees it." >/dev/null

          # The publish. --latest=false re-asserted even though prerelease
          # already implies it: the invariant in the header is not left to
          # implication.
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease --latest=false >/dev/null

          # Prove the asset is really reachable at the address every
          # installed site will build, or fail THIS run rather than let a
          # site discover it after its 10-minute wait.
          sleep 5
          curl -sSfLI -o /dev/null \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET}"
          echo "Published ${ASSET} on ${RELEASE_TAG} at ${GITHUB_SHA}"
