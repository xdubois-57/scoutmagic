; Per-directory PHP overrides for shared/FTP hosting running PHP via
; CGI/FastCGI/PHP-FPM (the deployment model documented in README.md — a
; php.ini a site admin can't edit directly). Ignored by PHP's mod_php SAPI
; and by the `php -S` built-in dev server used locally (see README.md's
; dev server command for the local-dev equivalent via -d flags).
;
; These limits are DOCUMENT-ROOT-WIDE: every route runs through
; public/index.php, so they apply to /login and every other endpoint too,
; and PHP buffers a urlencoded body into memory before application code
; runs (audit M2). They are therefore kept small; the two large consumers
; (gallery media, backup-restore upload) send big files as ~8 MB chunks
; through their normal routes instead (assets/js/chunked-upload.js +
; Core\File\ChunkedUploadStore). The largest remaining single-POST upload
; is the section-documents 20M ceiling; 48M also covers the no-JS
; backup-restore fallback for small archives (bigger ones need JS).
upload_max_filesize = 32M
post_max_size = 48M
