; Per-directory PHP overrides for shared/FTP hosting running PHP via
; CGI/FastCGI/PHP-FPM (the deployment model documented in README.md — a
; php.ini a site admin can't edit directly). Ignored by PHP's mod_php SAPI
; and by the `php -S` built-in dev server used locally (see README.md's
; dev server command for the local-dev equivalent via -d flags).
;
; Defaults ship far too low for media uploads (post_max_size is commonly
; 8M, upload_max_filesize 2M) — raised here to comfortably cover the
; gallery module's configurable "max photo/video upload size" settings
; (defaults: 30M photos, 2048M videos — Config\Galerie photos et vidéos).
upload_max_filesize = 2048M
post_max_size = 2200M
